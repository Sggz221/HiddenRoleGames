# Git hooks (https://lefthook.dev). Installed automatically by `pnpm install`.
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,jsx,tsx,mjs,cjs,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test

commit-msg:
  commands:
    conventional:
      run: node scripts/check-commit-msg.mjs {1}
