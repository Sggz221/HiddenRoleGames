# Local environment.
#
#   pnpm infra:up      -> only PostgreSQL + Redis (use with `pnpm dev`)
#   pnpm docker:up     -> everything, including the production image on http://localhost:3000
#   pnpm infra:down    -> stop all (data is kept in named volumes)
#
# For day-to-day frontend work prefer `pnpm dev` (Vite HMR) + `pnpm infra:up`; use the
# app container to verify the real production build before opening a PR.

name: howlsinthedark

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: howlsinthedark
      POSTGRES_PASSWORD: howlsinthedark
      POSTGRES_DB: howlsinthedark
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U howlsinthedark"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs the migrations once, then exits (mirrors Railway's pre-deploy command).
  migrate:
    image: howlsinthedark:local
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["app"]
    command: ["node", "dist/persistence/migrate.js"]
    environment:
      DATABASE_URL: postgres://howlsinthedark:howlsinthedark@postgres:5432/howlsinthedark
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: howlsinthedark:local
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["app"]
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_URL: http://localhost:${APP_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://howlsinthedark:howlsinthedark@postgres:5432/howlsinthedark
      REDIS_URL: redis://redis:6379
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
